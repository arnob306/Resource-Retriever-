[project]
name = "resource-retriever"
version = "0.1.0"
description = "Local semantic search over teaching resource PDFs"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "typer>=0.12",
    "google-api-python-client>=2.130",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
find-resource = "resource_retriever.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: slower tests that hit the real embedding model and/or Chroma on disk"]
